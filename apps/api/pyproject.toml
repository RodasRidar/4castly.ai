[project]
name = "castly-api"
version = "0.1.0"
description = "4castly.ai thin HTTP API: upload, parse, CRUD and job enqueueing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "castly-inventory",
    "fastapi>=0.160.0",
    "pydantic-settings>=2.16.1",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[tool.uv.sources]
castly-inventory = { path = "../../packages/inventory", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov", "--cov-report=term-missing:skip-covered"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return consistency
    "PT",       # pytest style
    "PL",       # pylint subset
    "RUF",      # ruff-specific
    "S",        # bandit security
    "T20",      # no print
    "DTZ",      # timezone-aware datetimes
    "TID",      # tidy imports
    "ANN",      # annotations
    "ARG",      # unused arguments
    "ERA",      # commented-out code
]
ignore = [
    "ANN401",   # Any is sometimes unavoidable at third-party boundaries
    "COM812",   # formatter conflict
    "ISC001",   # formatter conflict
]

[tool.ruff.lint.per-file-ignores]
"src/api/routers/*.py" = [
    "ARG001",   # stubs until B4: the parameters are the contract and are not used yet
    "PLR0913",  # a filtered, sorted, paginated list has many query parameters
    "PLR0917",  # same
]
"src/api/mock_fixtures/*.py" = [
    "PLR0913",  # fixture builders take many named fields
    "E501",     # data tables with long literals (Spanish copy, sample values)
]
"tests/**/*.py" = [
    "S101",     # pytest relies on bare asserts
    "PLR2004",  # magic values are fine in expected-value assertions
    "ANN",      # fixtures and tests need no annotations
    "ARG",      # fixtures are injected by name
]

[tool.ruff.lint.isort]
known-first-party = ["api"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
source = ["api"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    '^\\s*\\.\\.\\.$',   # Protocol method bodies
]
