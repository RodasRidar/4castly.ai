[project]
name = "castly-api"
version = "0.1.0"
description = "4castly.ai thin HTTP API: upload, parse, CRUD and job enqueueing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.160.0",
    "pydantic-settings>=2.16.1",
    "supabase>=2.33.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "api"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
