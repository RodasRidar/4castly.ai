[project]
name = "castly-worker"
version = "0.1.0"
description = "4castly.ai worker: ingestion, cleaning and forecasting"
readme = "README.md"
authors = [
    { name = "Richard Rodas", email = "richard_rodas01@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "openpyxl>=3.1.5",
    "pandera>=0.34.1",
    "polars>=2.0.0",
    "statsforecast>=2.1.1",
    "timesfm[mlx]>=3.0.2",
]

[tool.uv.build-backend]
module-name = "worker"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
