[project]
name = "castly-worker"
version = "0.1.0"
description = "4castly.ai worker: ingestion, cleaning and forecasting"
readme = "README.md"
authors = [
    { name = "Richard Rodas", email = "richard_rodas01@hotmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "anthropic>=2.2.0",
    "castly-inventory",
    "castly-telemetry",
    "defusedxml>=0.7.1",
    "httpx2>=2.16.0",
    "openpyxl>=3.1.5",
    "pandera>=0.34.1",
    "polars>=2.0.0",
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2",
    "statsforecast>=2.1.1",
]

[tool.uv.build-backend]
module-name = "worker"

[tool.uv.sources]
castly-inventory = { path = "../../packages/inventory", editable = true }
castly-telemetry = { path = "../../packages/telemetry", editable = true }
castly-pgtest = { path = "../../packages/pgtest", editable = true }

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "castly-pgtest",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.1",
    "ty>=0.0.90",
]
local = [
    "timesfm[mlx]>=3.0.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov", "--cov-report=term-missing:skip-covered"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return consistency
    "PT",       # pytest style
    "PL",       # pylint subset
    "RUF",      # ruff-specific
    "S",        # bandit security
    "T20",      # no print
    "DTZ",      # timezone-aware datetimes
    "TID",      # tidy imports
    "ANN",      # annotations
    "ARG",      # unused arguments
    "ERA",      # commented-out code
]
ignore = [
    "ANN401",   # Any is sometimes unavoidable at third-party boundaries
    "COM812",   # formatter conflict
    "ISC001",   # formatter conflict
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # pytest relies on bare asserts
    "PLR2004",  # magic values are fine in expected-value assertions
    "ANN",      # fixtures and tests need no annotations
    "ARG",      # fixtures are injected by name
    "DTZ",      # fixtures use naive local timestamps, matching the Kardex source
    "E741",     # column-letter constants (I, O) mirror the spreadsheet layout
    "PLR0913",  # synthetic-row builders mirror the spreadsheet columns
    "PLR0917",  # same as above
]

[tool.ruff.lint.isort]
known-first-party = ["worker"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
source = ["worker"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    '^\\s*\\.\\.\\.$',   # Protocol method bodies
]
