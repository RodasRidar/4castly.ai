name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  python:
    name: ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [apps/api, apps/worker, packages/inventory, packages/telemetry, packages/pgtest]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: ${{ matrix.app }}/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run ty check
      # Real TimesFM inference is gated by RUN_TIMESFM and stays skipped in CI. The api job also runs
      # the RLS tests against the runner's PostgreSQL binaries and must not skip them.
      - run: uv run pytest -q
        env:
          REQUIRE_DB_TESTS: ${{ (matrix.app == 'apps/api' || matrix.app == 'apps/worker') && '1' || '' }}

  contracts:
    name: contract drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: apps/api/uv.lock
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: cd apps/api && uv sync --locked
      - run: make contracts
      # Fails when the Pydantic schemas changed without regenerating openapi.json / schema.gen.ts.
      - run: git diff --exit-code -- apps/api/openapi.json apps/web/src/services/http/schema.gen.ts
