[project]
name = "castly-telemetry"
version = "0.1.0"
description = "Shared logging, redaction and trace export for the API and the worker (no client data leaves)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "opentelemetry-exporter-otlp-proto-http>=1.45.1",
    "opentelemetry-sdk>=1.45.1",
    "structlog>=26.1.0",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "telemetry"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers", "--cov", "--cov-report=term-missing:skip-covered"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "A",        # builtins shadowing
    "C4",       # comprehensions
    "SIM",      # simplify
    "RET",      # return consistency
    "PT",       # pytest style
    "PL",       # pylint subset
    "RUF",      # ruff-specific
    "S",        # bandit security
    "T20",      # no print
    "DTZ",      # timezone-aware datetimes
    "TID",      # tidy imports
    "ANN",      # annotations
    "ARG",      # unused arguments
    "ERA",      # commented-out code
]
ignore = [
    "ANN401",   # Any is sometimes unavoidable at third-party boundaries
    "COM812",   # formatter conflict
    "ISC001",   # formatter conflict
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # pytest relies on bare asserts
    "PLR2004",  # magic values are fine in expected-value assertions
    "ANN",      # fixtures and tests need no annotations
    "S106",     # fake tokens in tests
    "ARG",      # fixtures are injected by name
]

[tool.ruff.lint.isort]
known-first-party = ["telemetry"]

[tool.ruff.format]
docstring-code-format = true

[tool.ty.environment]
python-version = "3.12"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.terminal]
error-on-warning = true

[tool.coverage.run]
branch = true
source = ["telemetry"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    '^\\s*\\.\\.\\.$',   # Protocol method bodies
]
